<style>
/* Concepto: una columna de teléfono, números grandes, todo redondeado; verde sereno como único acento. */
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --surface-2: #E7ECE9;
  --fg: #14201B;
  --muted: #62736B;
  --line: #DCE3DF;
  --accent: #1B7A5A;
  --on-accent: #FFFFFF;
  --expense: #C2423C;
  --income: #1B7A5A;
  --warn: #9A6A12;
  --shadow: 0 6px 20px rgba(20, 32, 27, .14);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm: 12px; --r-md: 18px; --r-lg: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --surface: #17211D; --surface-2: #213029; --fg: #EBF1ED; --muted: #98AAA1;
    --line: #2A3932; --accent: #46C197; --on-accent: #06251A; --expense: #F27A72; --income: #46C197;
    --warn: #E2AE52; --shadow: 0 6px 20px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #17211D; --surface-2: #213029; --fg: #EBF1ED; --muted: #98AAA1;
  --line: #2A3932; --accent: #46C197; --on-accent: #06251A; --expense: #F27A72; --income: #46C197;
  --warn: #E2AE52; --shadow: 0 6px 20px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 520px; margin-inline: auto; padding-block: 20px 150px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
.h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.01em; margin: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 14px; }
.chip-rate { background: var(--surface-2); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; min-height: 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 46px); letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.seg button { flex: 1; min-height: 44px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 8px 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn { min-height: 56px; border-radius: var(--r-lg); background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 17px; padding: 0 24px; width: 100%; }
.btn.quiet { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: var(--expense); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { min-height: 52px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 0 16px; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--expense); }
.err { color: var(--expense); font-size: 14px; font-weight: 600; }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; font-weight: 700; background: var(--surface); }
.banner.bad { border-color: var(--expense); color: var(--expense); }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; min-height: 66px; }
.tx .ico { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; flex: none; }
.tx .mid { flex: 1; min-width: 0; }
.tx .mid b, .tx .mid span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .mid span { color: var(--muted); font-size: 14px; }
.tx .amt { text-align: right; flex: none; }
.tx .amt b { display: block; font-variant-numeric: tabular-nums; }
.tx .amt span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pos { color: var(--income); }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.empty { text-align: center; padding: 32px 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty .big { font-size: 40px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 5; }
.nav .in { width: 100%; max-width: 520px; display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; gap: 4px; align-items: center; }
.nav .plus { width: 56px; height: 56px; min-height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 32px; line-height: 1; justify-self: center; box-shadow: var(--shadow); margin-top: -22px; display: grid; place-items: center; }
.nav button { min-height: 52px; border-radius: var(--r-md); font-size: 13px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.nav button { position: relative; }
.nav button .e { font-size: 20px; }
.nav .dot { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--expense); color: #fff; font-size: 11px; font-style: normal; font-weight: 800; display: grid; place-items: center; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--surface-2); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.amount { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0 18px; }
.amount.bad { border-color: var(--expense); }
.amount span { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--muted); }
.amount input { flex: 1; min-width: 0; border: 0; background: none; text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 40px; padding: 14px 0; font-variant-numeric: tabular-nums; outline: none; }
.amount:focus-within { outline: 3px solid var(--accent); }
.link { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 68px; }
.link .e { font-size: 26px; }
.link .chev { margin-left: auto; color: var(--muted); font-size: 20px; }
.back { align-self: flex-start; color: var(--accent); font-weight: 800; min-height: 44px; padding: 0 4px; }
textarea.box { width: 100%; min-height: 110px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 12px; font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .tx, .link { transition: transform .08s ease; } .btn:active, .chip:active, .tx:active, .link:active { transform: scale(.98); } }
[hidden] { display: none !important; }
.receipt-preview { display:block; width:100%; max-height:360px; object-fit:contain; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); margin-top:10px; }
.field select, select { width:100%; min-height:48px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); color:var(--fg); padding:0 12px; font:inherit; }
.auth { max-width: 420px; margin-inline: auto; padding-block: 48px 40px; display: flex; flex-direction: column; gap: 16px; }
.auth .brand { font-size: 40px; }
.auth form { display: flex; flex-direction: column; gap: 14px; }
.auth .switch { color: var(--accent); font-weight: 800; min-height: 44px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 488px; margin-inline: auto; background: var(--fg); color: var(--bg); border-radius: var(--r-md); padding: 14px 16px; font-weight: 700; font-size: 14px; z-index: 20; box-shadow: var(--shadow); }
.banner .retry { color: inherit; text-decoration: underline; font-weight: 800; margin-left: 8px; min-height: 32px; }
.who { word-break: break-all; }
/* v0.2: fotos, logos y filas con imagen */
.pic { flex: none; border-radius: 50%; object-fit: cover; background: var(--surface-2); display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: var(--accent); }
.pic.sm { width: 40px; height: 40px; font-size: 17px; }
.pic.md { width: 44px; height: 44px; font-size: 19px; }
.pic.lg { width: 72px; height: 72px; font-size: 30px; border-radius: 22px; }
.pic.xl { width: 96px; height: 96px; font-size: 40px; }
.avbtn { border-radius: 50%; min-width: 40px; min-height: 40px; display: grid; place-items: center; }
.topr { display: flex; align-items: center; gap: 10px; }
.rowl { display: flex; align-items: center; gap: 14px; min-width: 0; }
.cardbtn { text-align: left; width: 100%; font: inherit; color: inherit; }
.cardbtn .row { width: 100%; }
.btn.small { min-height: 44px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; width: auto; cursor: pointer; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.file:focus-visible + .linkbtn, .file:focus-visible ~ * { outline: 3px solid var(--accent); }
.linkbtn { color: var(--expense); font-weight: 800; min-height: 44px; text-align: left; padding: 0 4px; }
.link .pic { margin-right: 0; }
/* v0.3: deslizar para confirmar eliminación */
.slidebox { display: flex; flex-direction: column; gap: 8px; }
.slide { position: relative; height: 60px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--expense); overflow: hidden; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none; }
.slide-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--expense); opacity: .35; pointer-events: none; }
.slide-txt { position: relative; font-weight: 800; color: var(--expense); padding-left: 52px; pointer-events: none; }
.slide-thumb { position: absolute; left: 4px; top: 4px; width: 50px; height: 50px; border-radius: 50%; background: var(--expense); color: #fff; font-size: 28px; font-weight: 800; line-height: 1; display: grid; place-items: center; touch-action: none; cursor: grab; }
.linkbtn.plain { color: var(--muted); align-self: center; }
.dangerzone { background: transparent; border: 0; padding: 0; }
/* v0.4: pagos, avisos, presupuestos y gastos divididos */
.item { display: flex; gap: 8px; align-items: stretch; }
.item .tx { flex: 1; min-width: 0; }
.paybtn { flex: none; align-self: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 14px; }
.agi.soon { border-color: var(--warn); }
.agi.today, .agi.late { border-color: var(--expense); background: color-mix(in srgb, var(--expense) 8%, var(--surface)); }
.tagl { color: var(--expense) !important; font-weight: 800; }
.pbar { display: block !important; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .num { font-size: 20px; overflow-wrap: anywhere; }
.hero.small { font-size: clamp(26px, 8vw, 32px); }
.bar.warnb i { background: var(--warn); }
.bar.over i { background: var(--expense); }
.banner.firm { text-align: left; width: 100%; font-weight: 800; }
.sprow { display: grid; grid-template-columns: 1fr 110px 36px; gap: 8px; align-items: center; }
.sprow input { min-height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; }
.field input[type="date"] { appearance: none; -webkit-appearance: none; text-align: left; }
.seg button { font-size: 15px; }


/* Cuadre v0.6 · renovación visual premium, responsive y accesible */
:root {
  --bg: #F4F7F5;
  --surface: #FFFFFF;
  --surface-2: #EAF0EC;
  --fg: #14251D;
  --muted: #63766C;
  --line: #DDE7E0;
  --accent: #16815D;
  --on-accent: #FFFFFF;
  --expense: #C84F51;
  --income: #16815D;
  --warn: #9A6A12;
  --shadow: 0 10px 32px rgba(22, 53, 38, .08);
  --r-sm: 14px; --r-md: 20px; --r-lg: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A120E; --surface: #121E17; --surface-2: #1A2A21; --fg: #F0F6F2; --muted: #9AAFA2;
    --line: #293B30; --accent: #56D6A4; --on-accent: #092318; --expense: #FF8585; --income: #56D6A4;
    --warn: #E9BC65; --shadow: 0 12px 36px rgba(0, 0, 0, .24); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A120E; --surface: #121E17; --surface-2: #1A2A21; --fg: #F0F6F2; --muted: #9AAFA2;
  --line: #293B30; --accent: #56D6A4; --on-accent: #092318; --expense: #FF8585; --income: #56D6A4;
  --warn: #E9BC65; --shadow: 0 12px 36px rgba(0, 0, 0, .24); color-scheme: dark;
}
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(ellipse at 8% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 34rem),
    var(--bg);
  letter-spacing: -.012em;
}
#app.wrap, #app { width: min(100% - 32px, 980px); max-width: 980px; margin-inline: auto; padding: 30px 0 150px; gap: 18px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 29px; letter-spacing: -.055em; }
.brand::before {
  content: "↗"; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 13px;
  color: var(--on-accent); background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #0D4631));
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 22%, transparent); font-family: var(--font-body); font-size: 21px; font-weight: 800;
}
.h2 { font-size: clamp(25px, 3vw, 32px); letter-spacing: -.045em; }
.label { letter-spacing: .095em; font-size: 11px; }
.card {
  border-radius: 24px; border-color: color-mix(in srgb, var(--line) 82%, transparent); padding: 22px;
  box-shadow: var(--shadow); gap: 10px; transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.card:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.hero { letter-spacing: -.06em; line-height: 1.02; }
.btn { border-radius: 17px; box-shadow: 0 7px 18px color-mix(in srgb, var(--accent) 18%, transparent); transition: transform .15s ease, filter .15s ease, box-shadow .15s ease; }
.btn:hover { filter: brightness(1.04); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn:active, .chip:active, .link:active, .tx:active { transform: scale(.99); }
.btn.quiet { box-shadow: none; border: 1px solid var(--line); }
.field input, .sprow input, textarea.box, select { border-radius: 15px; transition: border-color .15s ease, box-shadow .15s ease; }
.field input:focus, .sprow input:focus, textarea.box:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent); outline: none; }
.chip-rate { border: 1px solid var(--line); background: var(--surface); box-shadow: 0 3px 10px rgba(15,40,26,.04); }
.tx, .link { border-radius: 19px; border-color: var(--line); padding: 14px; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
.tx:hover, .link:hover { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); background: color-mix(in srgb, var(--surface) 88%, var(--accent)); }
.tx .ico { border-radius: 15px; width: 46px; height: 46px; }
.seg { padding: 4px; border: 1px solid var(--line); }
.seg button[aria-pressed="true"] { box-shadow: 0 2px 8px rgba(12,35,22,.09); }
.chip { border-radius: 14px; }
.banner { border-radius: 17px; }
.empty { border: 1px dashed var(--line); border-radius: 24px; background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 42px 18px; }
.auth {
  width: min(100% - 32px, 460px); margin: clamp(28px, 10vh, 100px) auto 48px; padding: clamp(26px, 5vw, 42px);
  border: 1px solid var(--line); border-radius: 30px; background: color-mix(in srgb, var(--surface) 94%, transparent);
  box-shadow: 0 22px 70px rgba(16, 44, 28, .10); backdrop-filter: blur(16px); gap: 18px;
}
.auth .brand { font-size: 34px; margin-bottom: 3px; }
.auth .muted { line-height: 1.65; }
.auth form { gap: 16px; }
.auth .field input { min-height: 56px; }
.auth .switch { min-height: 44px; border-radius: 12px; font-weight: 750; }
.auth .switch:hover { background: var(--surface-2); }
.auth .otp-input { text-align: center; font-size: 1.35rem; font-weight: 800; letter-spacing: .3em; font-variant-numeric: tabular-nums; }
.auth .otp-input::placeholder { letter-spacing: normal; font-size: .95rem; font-weight: 500; }

.nav {
  background: color-mix(in srgb, var(--surface) 91%, transparent); border: 1px solid var(--line);
  box-shadow: 0 12px 40px rgba(11, 30, 19, .12); backdrop-filter: blur(18px);
  left: 50%; right: auto; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 24px), 620px); border-radius: 24px; padding: 8px 12px;
}
.nav .in { max-width: none; }
.nav .plus { border: 4px solid var(--surface); width: 58px; height: 58px; min-height: 58px; margin-top: -27px; }
.nav button { border-radius: 15px; }
.nav button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.sheet { border: 1px solid var(--line); box-shadow: 0 -18px 60px rgba(0,0,0,.16); }
.toast { border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(12px); }
@media (min-width: 760px) {
  #app.wrap, #app { padding-top: 36px; padding-bottom: 132px; gap: 20px; }
  .top { padding: 4px 2px 8px; }
  .top .brand { font-size: 32px; }
  .h2 { margin-top: 6px; }
  .card { padding: 25px; }
  .hero { font-size: clamp(38px, 5vw, 54px); }
  .nav { bottom: 18px; }
